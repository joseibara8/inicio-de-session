<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memes</title>
  <link rel="stylesheet" href="index.css">
  <script defer src="./index.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <div class="header">
    <nav class="nav">
        
            <h1 class="titulo">To do List</h1>
            <a href="/login"><button class="button-iniciar-session" href="/login">iniciar session</button></a>
    </div>
    <main>
        <div class="contenedor">

                <h2 class="titulo_lista">Agregue su cosa por hacer</h2>
            <div class="lista">
                <textarea class="agregar" 
                placeholder="comprar un paquete de..."></textarea>
                <button class="enviar" type="submit">
                    <span           class="material-symbols-outlined">
                        arrow_downward
                    </span>
                </button>

            </div>
            <h2 class="titulo_listas"> Sus Listas</h2>
            <div class="contenedor__de_listas">

                    
            </div>
            
        </div>
        <div id="fondo" class="oculto"></div>
        <div  id="modal" class="oculto">
            <h2 class="titulo-modal">Editar Nota</h2>

            <textarea  id="textarea-modal"></textarea>
            
            <div class="botones-modal">

            <button class="boton-modal" id="cancelar" type="submit">
                    <span           class="material-symbols-outlined">
                        close
                    </span>
            </button>
                <button class="boton-modal" id="guardar" type="submit">
                    <span           class="material-symbols-outlined">
                        check
                    </span>
                </button>
            </div>
        
    </div>
    </main>
</body>
</html>
