<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="index.css">
  <script defer src="./index.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
  <header class="encabezado-aplicacion">
    <nav class="navegacion-aplicacion">
      <h1 class="titulo-aplicacion">Lista de tareas</h1>
      <a href="/login">
        <button class="boton-iniciar-sesion" type="button">Iniciar sesión</button>
      </a>
    </nav>
  </header>

  <main class="aplicacion-tareas">
    <h2 class="titulo-formulario-tareas">Agregue su tarea</h2>

    <div class="formulario-tareas">
      <textarea
        class="entrada-nueva-tarea"
        placeholder="Comprar un paquete de..."
      ></textarea>
      <button class="boton-agregar-tarea" type="button" aria-label="Agregar tarea">
        <span class="material-symbols-outlined">arrow_downward</span>
      </button>
    </div>

    <h2 class="titulo-lista-tareas">Sus tareas</h2>
    <div class="lista-tareas"></div>
  </main>

  <div id="fondo-modal" class="esta-oculto"></div>

  <section id="modal-editar-tarea" class="esta-oculto" aria-label="Editar tarea">
    <h2 class="titulo-modal">Editar tarea</h2>
    <textarea id="entrada-editar-tarea"></textarea>

    <div class="acciones-modal">
      <button class="boton-modal" id="cancelar-edicion-tarea" type="button" aria-label="Cancelar">
        <span class="material-symbols-outlined">close</span>
      </button>
      <button class="boton-modal" id="guardar-edicion-tarea" type="button" aria-label="Guardar">
        <span class="material-symbols-outlined">check</span>
      </button>
    </div>
  </section>

  <section id="modal-titulo-tarea" class="esta-oculto" aria-label="Escribir título de tarea">
    <h2 class="titulo-modal">Escribe el título</h2>
    <textarea id="entrada-titulo-tarea" placeholder="Ir a recoger..."></textarea>

    <div class="acciones-modal">
      <button class="boton-modal" id="cancelar-titulo-tarea" type="button" aria-label="Cancelar">
        <span class="material-symbols-outlined">close</span>
      </button>
      <button class="boton-modal" id="guardar-titulo-tarea" type="button" aria-label="Guardar">
        <span class="material-symbols-outlined">check</span>
      </button>
    </div>
  </section>
</body>
</html>
