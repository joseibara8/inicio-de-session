<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inicio de session</title>
</head>
<body>
    <div class="login-container">
        
        <h1 class="login-tittle">Inicia Sesion</h1>
        <span class="login-email-label">Email</span>
        <input class="login-email" type="email" placeholder="ejemplo@gmail.com">
        <span class="login-email-error"></span>
        <span class="login-contraseña-label">contraseña</span>
        <div class="login-contenedor-contraseña">
            <input class="login-password"type="password"placeholder="contraseña">
            <button class="ojo">
                <span class="material-symbols-outlined">
                    visibility
                </span>
            </button>
        </div>
        <span class="login-contraseña-error"></span>
        <button class="login-button">Iniciar sesion</button>
        <span class="login-button-error"></span>
        
    </div>
    <div class="div-no-account"><a href="/register" class="loging-no-account" >No tienes cuenta ¿quieres crear una cuenta?</a></div>
    <script src="login.js"></script>
</body>
</html>
