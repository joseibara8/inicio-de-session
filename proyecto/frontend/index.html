<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="index.css">
  <script defer src="./index.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
  <header class="app-header">
    <nav class="app-navigation">
      <h1 class="app-title">To Do List</h1>
      <a href="/login">
        <button class="login-button" type="button">Iniciar sesión</button>
      </a>
    </nav>
  </header>

  <main class="todo-app">
    <h2 class="todo-form__heading">Agregue su cosa por hacer</h2>

    <div class="todo-form">
      <textarea
        class="todo-form__input"
        placeholder="Comprar un paquete de..."
      ></textarea>
      <button class="todo-form__submit" type="button" aria-label="Agregar nota">
        <span class="material-symbols-outlined">arrow_downward</span>
      </button>
    </div>

    <h2 class="todo-list__heading">Sus listas</h2>
    <div class="todo-list"></div>
  </main>

  <div id="modal-overlay" class="is-hidden"></div>

  <section id="note-editor-modal" class="is-hidden" aria-label="Editar nota">
    <h2 class="modal__title">Editar nota</h2>
    <textarea id="note-editor-input"></textarea>

    <div class="modal__actions">
      <button class="modal__button" id="cancel-note-edit" type="button" aria-label="Cancelar">
        <span class="material-symbols-outlined">close</span>
      </button>
      <button class="modal__button" id="save-note-edit" type="button" aria-label="Guardar">
        <span class="material-symbols-outlined">check</span>
      </button>
    </div>
  </section>

  <section id="note-title-modal" class="is-hidden" aria-label="Escribir título de nota">
    <h2 class="modal__title">Escribe el título</h2>
    <textarea id="note-title-input" placeholder="Ir a recoger..."></textarea>

    <div class="modal__actions">
      <button class="modal__button" id="cancel-note-title" type="button" aria-label="Cancelar">
        <span class="material-symbols-outlined">close</span>
      </button>
      <button class="modal__button" id="save-note-title" type="button" aria-label="Guardar">
        <span class="material-symbols-outlined">check</span>
      </button>
    </div>
  </section>
</body>
</html>
