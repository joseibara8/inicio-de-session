<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crear</title>
</head>
<body>
    <div class="register-container">
        <input class="register-name" type="text" placeholder="Daniel">
        <input class="register-surname" type="text" placeholder="Satos Perez" aria-placeholder="genero">
        <input type="date" id="register-birthdate" name="birthdate">
        <select name="register-gender" id="register-gender">
                <option value="masculino">Masculino</option>
                <option value="femenino">Femenino</option>
                <option value="otro">Otro</option>
        </select>
        <input class="register-email" type="email" placeholder="ejemplo@gmail.com">
        <input class="register-password" type="password" placeholder="contraseña">
        <input class="register-password-confirm" type="password" placeholder="contraseña">
        <button class="register-button">Crear Cuenta</button>
        <span class="register-error">hola</span>
        <a href="index.html" class="register-no-acaunt" >No tienes cuenta ¿quieres crear una cuenta?</a>
    </div>
    <script src="register.js"></script>
</body>
</html>
